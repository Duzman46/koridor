name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # The release variant, because it is the one that ships and it is the one that breaks
      # differently: R8 removed a class Room looks up by name and the app died before
      # onCreate, which a debug-only run cannot see. Neither monetization.properties nor
      # keystore.properties is in the repository, so this builds against Google's test ad
      # units and produces an unsigned APK — which is exactly what is wanted from a check
      # that is about the shrinker rather than about the artefact.
      - name: Verify project
        run: ./gradlew :app:test :app:lintRelease :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gridbound-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
